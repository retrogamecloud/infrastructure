name: ArgoCD CI/CD CDN

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'cdn/**'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'cdn/**'

env:
  DOCKERHUB_USERNAME: retrogamecloud
  GHCR_REGISTRY: ghcr.io
  DOCKERHUB_IMAGE: retrogamecloud/cdn
  GHCR_IMAGE: ghcr.io/retrogamecloud/cdn
  CDN_PATH: cdn

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      
    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extraer metadatos
        id: meta
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "branch=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT
          echo "date=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

      - name: Construir y publicar en Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: ./${{ env.CDN_PATH }}
          push: true
          tags: |
            ${{ env.DOCKERHUB_IMAGE }}:latest
            ${{ env.DOCKERHUB_IMAGE }}:sha-${{ steps.meta.outputs.sha_short }}
            ${{ env.DOCKERHUB_IMAGE }}:${{ steps.meta.outputs.branch }}-${{ steps.meta.outputs.date }}
          cache-from: type=registry,ref=${{ env.DOCKERHUB_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.DOCKERHUB_IMAGE }}:buildcache,mode=max

      - name: Construir y publicar en GitHub Container Registry
        uses: docker/build-push-action@v5
        with:
          context: ./${{ env.CDN_PATH }}
          push: true
          tags: |
            ${{ env.GHCR_IMAGE }}:latest
            ${{ env.GHCR_IMAGE }}:sha-${{ steps.meta.outputs.sha_short }}
            ${{ env.GHCR_IMAGE }}:${{ steps.meta.outputs.branch }}-${{ steps.meta.outputs.date }}

      - name: Actualizar manifiesto de Kubernetes
        run: |
          sed -i "s|image: retrogamecloud/cdn:.*|image: retrogamecloud/cdn:sha-${{ steps.meta.outputs.sha_short }}|g" k8s/cdn/deployment.yaml
          
      - name: Commitear y subir cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/cdn/deployment.yaml
          git commit -m "Actualizar imagen cdn a sha-${{ steps.meta.outputs.sha_short }}" || exit 0
          git push

      - name: Resumen de despliegue
        run: |
          echo "### 🚀 Resumen del Despliegue CDN" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tags en Docker Hub:**" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.DOCKERHUB_IMAGE }}:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.DOCKERHUB_IMAGE }}:sha-${{ steps.meta.outputs.sha_short }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.DOCKERHUB_IMAGE }}:${{ steps.meta.outputs.branch }}-${{ steps.meta.outputs.date }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tags en GitHub Packages:**" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.GHCR_IMAGE }}:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.GHCR_IMAGE }}:sha-${{ steps.meta.outputs.sha_short }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.GHCR_IMAGE }}:${{ steps.meta.outputs.branch }}-${{ steps.meta.outputs.date }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Manifiesto de Kubernetes actualizado en mismo repositorio**" >> $GITHUB_STEP_SUMMARY
