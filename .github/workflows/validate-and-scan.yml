name: Validación y escaneo de ficheros de infraestructura

on:
  push:
    branches:
      - main
    # Dejamos .gitignore ignorado pero permitimos que cambios en CHANGELOG.md disparen el workflow
    paths-ignore:
      - '.gitignore'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '.gitignore'
  workflow_dispatch:

concurrency:
            fi
            
            echo "" >> $GITHUB_STEP_SUMMARY
            cd "$GITHUB_WORKSPACE"
          done
          
          if [ $VALIDATION_FAILED -ne 0 ]; then
            echo "::error title=Validación de Terraform::Se encontraron problemas en las configuraciones de Terraform"
            exit 1
          fi


## JOB PARA VALIDACIÓN DE ARGOCD ##
  validate-argocd:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    continue-on-error: true
    
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v6

      - name: Validar configuraciones de ArgoCD
        run: |
          echo "## 🔄 Validación de ArgoCD" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Encontrar archivos de ArgoCD
          ARGOCD_FILES=$(find . -path "*/argocd/*" -name "*.yaml" -o -path "*/argocd/*" -name "*.yml" | grep -v node_modules)
          
          if [ -z "$ARGOCD_FILES" ]; then
            echo "⚠️ No se encontraron configuraciones de ArgoCD" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          
          VALIDATION_FAILED=0
          
          for file in $ARGOCD_FILES; do
            echo "📄 Validando: $file"
            
            # Verificar que tenga estructura básica de ArgoCD
            if grep -q "apiVersion:" "$file" && (grep -q "kind: Application" "$file" || grep -q "kind: AppProject" "$file"); then
              echo "- ✅ \`$file\` (ArgoCD resource)" >> $GITHUB_STEP_SUMMARY
            else
              echo "- ℹ️ \`$file\` (Kubernetes resource)" >> $GITHUB_STEP_SUMMARY
            fi
          done
          
          if [ $VALIDATION_FAILED -ne 0 ]; then
            echo "::warning title=Validación de ArgoCD::Se encontraron advertencias en las configuraciones"
          fi

## JOB PARA ESCANEO DE SEGURIDAD CON SONARCLOUD ##
  sonarcloud-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    continue-on-error: true
    
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6.0.0
        continue-on-error: true
        id: sonar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=retrogamecloud_${{ github.event.repository.name }}
            -Dsonar.organization=retrogamecloud
            -Dsonar.sources=terraform,argocd,monitoring
            -Dsonar.exclusions=**/*.tfstate,**/*.tfstate.backup,**/node_modules/**,**/.terraform/**

      - name: Verificar resultado de SonarCloud
        if: always()
        run: |
          echo "## 🔍 SonarCloud Scan" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -z "${{ secrets.SONAR_TOKEN }}" ]; then
            echo "::warning title=SonarCloud Deshabilitado::SONAR_TOKEN no configurado."
            echo "⚠️ SonarCloud no configurado - configura SONAR_TOKEN para habilitar." >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.sonar.outcome }}" = "failure" ]; then
            echo "::error title=SonarCloud Falló::El análisis encontró problemas."
            echo "❌ El análisis de SonarCloud falló. Revisa los logs." >> $GITHUB_STEP_SUMMARY
            exit 1
          elif [ "${{ steps.sonar.outcome }}" = "success" ]; then
            echo "✅ Análisis de SonarCloud completado exitosamente." >> $GITHUB_STEP_SUMMARY
          fi

## JOB PARA ESCANEO DE SEGURIDAD CON SNYK ##
  snyk-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    continue-on-error: true
    
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v6

      - name: Ejecutar Snyk para escanear vulnerabilidades en IaC
        id: snyk-iac
        uses: snyk/actions/iac@master
        if: github.event.repository.private == false && env.ENABLE_SNYK == 'true'
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --sarif-file-output=snyk-iac.sarif --json-file-output=snyk-iac.json

      - name: Mostrar resultados de Snyk IaC
        if: github.event.repository.private == false && env.ENABLE_SNYK == 'true'
        run: |
          echo "## 🔒 Snyk IaC Scan" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -z "${{ secrets.SNYK_TOKEN }}" ]; then
            echo "⚠️ SNYK_TOKEN no configurado - configura el secreto para habilitar escaneo." >> $GITHUB_STEP_SUMMARY
          name: Validación y escaneo de ficheros de infraestructura

          on:
            push:
              branches:
                - main
              paths-ignore:
                - '.gitignore'
            pull_request:
              branches:
                - main
              paths-ignore:
                - '.gitignore'
            workflow_dispatch:

          concurrency:
            group: ${{ github.workflow }}-${{ github.ref }}
            cancel-in-progress: true

          env:
            ENABLE_SNYK: true
            ENABLE_SLACK_NOTIFICATIONS: true

          permissions:
            contents: read
            security-events: write

          jobs:
            lint-infrastructure:
              runs-on: ubuntu-latest
              permissions:
                contents: read
              continue-on-error: true
              steps:
                - name: Clonar repositorio
                  uses: actions/checkout@v6
                - name: Configurar Node.js
                  uses: actions/setup-node@v6
                  with:
                    node-version: '20'
                    cache: 'npm'
                - name: Instalar dependencias
                  run: |
                    if [ -f package.json ]; then npm ci; else echo "No hay package.json"; fi
                - name: Ejecutar tests de validación
                  id: tests
                  continue-on-error: true
                  run: |
                    if [ -f package.json ] && npm run | grep -q "test"; then
                      if npm test; then echo "tests_failed=false" >> $GITHUB_OUTPUT; else echo "tests_failed=true" >> $GITHUB_OUTPUT; fi
                    else
                      echo "tests_failed=false" >> $GITHUB_OUTPUT
                    fi
                - name: Resumen
                  if: always()
                  run: |
                    echo "## 🔍 Lint/Tests Infra" >> $GITHUB_STEP_SUMMARY
                    if [ "${{ steps.tests.outputs.tests_failed }}" = "true" ]; then
                      echo "⚠️ Tests fallidos" >> $GITHUB_STEP_SUMMARY
                    else
                      echo "✅ Tests OK" >> $GITHUB_STEP_SUMMARY
                    fi

            validate-terraform:
              runs-on: ubuntu-latest
              permissions:
                contents: read
              steps:
                - name: Clonar repositorio
                  uses: actions/checkout@v6
                - name: Configurar Terraform
                  uses: hashicorp/setup-terraform@v3
                  with:
                    terraform_version: latest
                - name: Validar configuraciones
                  run: |
                    echo "## 🏗️ Terraform" >> $GITHUB_STEP_SUMMARY
                    TERRAFORM_DIRS=$(find terraform -name "*.tf" -exec dirname {} \; 2>/dev/null | sort -u)
                    if [ -z "$TERRAFORM_DIRS" ]; then
                      echo "ℹ️ Sin directorios Terraform" >> $GITHUB_STEP_SUMMARY; exit 0; fi
                    FAIL=0
                    for dir in $TERRAFORM_DIRS; do
                      echo "### Dir: $dir" >> $GITHUB_STEP_SUMMARY
                      cd "$dir"
                      if terraform fmt -check -recursive; then echo "- Formato OK" >> $GITHUB_STEP_SUMMARY; else echo "- Formato KO" >> $GITHUB_STEP_SUMMARY; FAIL=1; fi
                      if terraform init -backend=false > /dev/null 2>&1; then echo "- Init OK" >> $GITHUB_STEP_SUMMARY; else echo "- Init KO" >> $GITHUB_STEP_SUMMARY; FAIL=1; fi
                      if terraform validate 2>&1 | grep -q "backend/init-db"; then echo "- Validate omitido (dependencia externa)" >> $GITHUB_STEP_SUMMARY; else if terraform validate; then echo "- Validate OK" >> $GITHUB_STEP_SUMMARY; else echo "- Validate KO" >> $GITHUB_STEP_SUMMARY; FAIL=1; fi; fi
                      cd - >/dev/null
                      echo "" >> $GITHUB_STEP_SUMMARY
                    done
                    if [ $FAIL -ne 0 ]; then echo "::error title=Terraform::Fallo de validación"; exit 1; fi

            validate-argocd:
              runs-on: ubuntu-latest
              permissions:
                contents: read
              continue-on-error: true
              steps:
                - name: Clonar repositorio
                  uses: actions/checkout@v6
                - name: Validar configuraciones ArgoCD
                  run: |
                    echo "## 🔄 ArgoCD" >> $GITHUB_STEP_SUMMARY
                    ARGOCD_FILES=$(find . -path "*/argocd/*" -name "*.yaml" -o -path "*/argocd/*" -name "*.yml" 2>/dev/null | grep -v node_modules)
                    if [ -z "$ARGOCD_FILES" ]; then echo "ℹ️ Sin archivos ArgoCD" >> $GITHUB_STEP_SUMMARY; exit 0; fi
                    for f in $ARGOCD_FILES; do
                      if grep -q "apiVersion:" "$f" && (grep -q "kind: Application" "$f" || grep -q "kind: AppProject" "$f"); then echo "- ✅ $f" >> $GITHUB_STEP_SUMMARY; else echo "- ℹ️ $f" >> $GITHUB_STEP_SUMMARY; fi
                    done

            sonarcloud-scan:
              runs-on: ubuntu-latest
              permissions:
                contents: read
              continue-on-error: true
              steps:
                - name: Clonar repositorio
                  uses: actions/checkout@v6
                  with:
                    fetch-depth: 0
                - name: SonarCloud Scan
                  uses: SonarSource/sonarqube-scan-action@v6.0.0
                  id: sonar
                  env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                    SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
                  with:
                    args: >
                      -Dsonar.projectKey=retrogamecloud_${{ github.event.repository.name }}
                      -Dsonar.organization=retrogamecloud
                      -Dsonar.sources=terraform,argocd,monitoring
                      -Dsonar.exclusions=**/*.tfstate,**/*.tfstate.backup,**/node_modules/**,**/.terraform/**
                - name: Verificar SonarCloud
                  if: always()
                  run: |
                    echo "## 🔍 SonarCloud" >> $GITHUB_STEP_SUMMARY
                    if [ -z "${{ secrets.SONAR_TOKEN }}" ]; then echo "⚠️ SONAR_TOKEN faltante" >> $GITHUB_STEP_SUMMARY; elif [ "${{ steps.sonar.outcome }}" = "failure" ]; then echo "::error title=SonarCloud::Fallo"; exit 1; else echo "✅ OK" >> $GITHUB_STEP_SUMMARY; fi

            snyk-scan:
              runs-on: ubuntu-latest
              permissions:
                contents: read
                security-events: write
              continue-on-error: true
              steps:
                - name: Clonar repositorio
                  uses: actions/checkout@v6
                - name: Ejecutar Snyk IaC
                  id: snyk-iac
                  uses: snyk/actions/iac@master
                  if: github.event.repository.private == false && env.ENABLE_SNYK == 'true'
                  continue-on-error: true
                  env:
                    SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
                  with:
                    args: --sarif-file-output=snyk-iac.sarif --json-file-output=snyk-iac.json
                - name: Mostrar resultados Snyk
                  if: github.event.repository.private == false && env.ENABLE_SNYK == 'true'
                  run: |
                    echo "## 🔒 Snyk IaC" >> $GITHUB_STEP_SUMMARY
                    if [ -z "${{ secrets.SNYK_TOKEN }}" ]; then echo "⚠️ Falta SNYK_TOKEN" >> $GITHUB_STEP_SUMMARY; elif [ -f snyk-iac.json ]; then head -40 snyk-iac.json >> $GITHUB_STEP_SUMMARY; else echo "⚠️ Sin resultados" >> $GITHUB_STEP_SUMMARY; fi
                - name: Evaluar severidades Snyk
                  if: github.event.repository.private == false && env.ENABLE_SNYK == 'true'
                  run: |
                    if [ ! -f snyk-iac.json ]; then echo "⚠️ No hay json"; exit 0; fi
                    if command -v jq >/dev/null 2>&1; then
                      CRITICAL=$(jq '[..|objects|select(has("issue"))|.issue.severity|select(.=="critical")]|length' snyk-iac.json || echo 0)
                      HIGH=$(jq '[..|objects|select(has("issue"))|.issue.severity|select(.=="high")]|length' snyk-iac.json || echo 0)
                      MEDIUM=$(jq '[..|objects|select(has("issue"))|.issue.severity|select(.=="medium")]|length' snyk-iac.json || echo 0)
                    else
                      CRITICAL=$(grep -ci '"severity": *"critical"' snyk-iac.json || echo 0)
                      HIGH=$(grep -ci '"severity": *"high"' snyk-iac.json || echo 0)
                      MEDIUM=$(grep -ci '"severity": *"medium"' snyk-iac.json || echo 0)
                    fi
                    echo "Severidades: critical=$CRITICAL high=$HIGH medium=$MEDIUM" >> $GITHUB_STEP_SUMMARY
                    if [ "$CRITICAL" -gt 0 ]; then echo "::error title=Snyk Critical::${CRITICAL} críticas"; exit 1; fi
                    if [ "$HIGH" -gt 1 ]; then echo "::warning title=Snyk High::${HIGH} altas"; fi
                - name: Verificar SARIF
                  id: check-sarif
                  if: github.event.repository.private == false && env.ENABLE_SNYK == 'true'
                  run: |
                    if [ -f snyk-iac.sarif ]; then echo "sarif-exists=true" >> $GITHUB_OUTPUT; else echo "sarif-exists=false" >> $GITHUB_OUTPUT; fi
                - name: Upload SARIF
                  uses: github/codeql-action/upload-sarif@v4
                  if: github.event.repository.private == false && env.ENABLE_SNYK == 'true' && steps.check-sarif.outputs.sarif-exists == 'true'
                  with:
                    sarif_file: snyk-iac.sarif
                - name: Snyk omitido
                  if: github.event.repository.private == true || env.ENABLE_SNYK == 'false'
                  run: echo "Snyk omitido"

            notify-slack:
              needs: [lint-infrastructure, validate-terraform, validate-argocd, sonarcloud-scan, snyk-scan]
              if: >-
                always() && (
                  needs.validate-terraform.result == 'failure' ||
                  needs.sonarcloud-scan.result == 'failure'
                )
              runs-on: ubuntu-latest
              steps:
                - name: Notificar fallos en Slack
                  run: |
                    if [ "${{ env.ENABLE_SLACK_NOTIFICATIONS }}" = "true" ]; then
                      curl -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" -H 'Content-Type: application/json' -d '{"text":"❌ Workflow fallido: ${{ github.repository }}"}'
                    else
                      echo "Slack deshabilitado"
                    fi
          echo "✅ Pull Request de actualización creada (si no existía previamente)." >> $GITHUB_STEP_SUMMARY
