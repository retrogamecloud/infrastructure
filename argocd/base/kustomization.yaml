apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

resources:
  # SECRETOS GESTIONADOS POR TERRAFORM - NO incluir aquí
  # Los siguientes secretos se crean en terraform/eks/argocd-secrets.tf:
  # - argocd-secret (OAuth + server key)
  # - repo-retrogame-kubernetes (acceso al repo)
  # - repo-retrogame-infrastructure (acceso al repo)
  # - argocd-notifications-secret (Slack token)
  
  # Solo ConfigMaps e Ingress (sin secretos)
  - argocd-notifications-cm.yaml
  - argocd-ingress.yaml

patches:
  # Strategic merge patch to add GitHub OAuth without losing existing config
  - path: argocd-cm-patch.yaml
    target:
      kind: ConfigMap
      name: argocd-cm
  # RBAC configuration
  - path: argocd-rbac-cm.yaml
    target:
      kind: ConfigMap
      name: argocd-rbac-cm

labels:
  - pairs:
      app.kubernetes.io/managed-by: kustomize
