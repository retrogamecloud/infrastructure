apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

resources:
  - argocd-secret.yaml
  - argocd-repo.yaml
  - argocd-repo-infrastructure.yaml
  - argocd-notifications-cm.yaml
  - argocd-notifications-secret.yaml

patches:
  # Strategic merge patch to add GitHub OAuth without losing existing config
  - path: argocd-cm-patch.yaml
    target:
      kind: ConfigMap
      name: argocd-cm
  # RBAC configuration
  - path: argocd-rbac-cm.yaml
    target:
      kind: ConfigMap
      name: argocd-rbac-cm

labels:
  - pairs:
      app.kubernetes.io/managed-by: kustomize
