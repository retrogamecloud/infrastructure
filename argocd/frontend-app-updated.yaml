apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frontend
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: retrogame
    server: https://kubernetes.default.svc
  project: default
  revisionHistoryLimit: 10
  sources:
  - repoURL: https://github.com/retrogamecloud/kubernetes.git
    targetRevision: main
    path: .
    directory:
      recurse: false
      include: "04-frontend.yaml"
      exclude: "{00-*,01-*,02-*,03-*,05-*,06-*,package*,README*,*.md}"
  - repoURL: https://github.com/retrogamecloud/infrastructure.git
    targetRevision: feature/migrate-argocd-to-kubernetes-repo
    path: argocd/frontend-overlays
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
      limit: 5
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
