  index.html: "<!DOCTYPE html>\r\n<html lang=\"es\">\r\n<head>\r\n  <meta charset=\"UTF-8\">\r\n
    \ <title>Retro Game Hub - Iniciar Sesión</title>\r\n  <link rel=\"stylesheet\"
    href=\"retro.css\">\r\n  <link rel=\"icon\" type=\"image/svg+xml\" href=\"data:image/svg+xml,\r\n
    \ <svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'>\r\n    <circle
    cx='32' cy='32' r='24' fill='black' stroke='%2300ff88' stroke-width='4'>\r\n      <animate
    attributeName='stroke-opacity' values='1;0.3;1' dur='2s' repeatCount='indefinite'/>\r\n
    \   </circle>\r\n  </svg>\">\r\n</head>\r\n<body>\r\n  <div class=\"grid\"></div>\r\n\r\n
    \ <div class=\"panel\">\r\n    <h1>\U0001F579️ RETRO GAME HUB</h1>\r\n\r\n    <div
    id=\"login\">\r\n      <input id=\"username\" placeholder=\"Usuario\" />\r\n      <input
    id=\"password\" type=\"password\" placeholder=\"Contraseña\" onkeypress=\"if(event.key==='Enter')
    login()\" />\r\n      <button onclick=\"login()\">Entrar</button>\r\n      <p
    onclick=\"toggleForm()\">¿No tienes cuenta? Regístrate</p>\r\n    </div>\r\n\r\n
    \   <div id=\"register\" style=\"display:none;\">\r\n      <input id=\"newUsername\"
    placeholder=\"Elige un usuario\" />\r\n      <input id=\"newPassword\" type=\"password\"
    placeholder=\"Elige una contraseña\" onkeypress=\"if(event.key==='Enter') register()\"
    />\r\n      <button onclick=\"register()\">Registrar</button>\r\n      <p onclick=\"toggleForm()\">¿Ya
    tienes cuenta? Inicia sesión</p>\r\n    </div>\r\n  </div>\r\n\r\n  <script>\r\n
    \   // URL del API Gateway (Kong)\r\n    const API = \"https://retrogamehub.games/api/auth\";\r\n\r\n
    \   function toggleForm() {\r\n      document.getElementById(\"login\").style.display
    =\r\n        document.getElementById(\"login\").style.display === \"none\" ? \"block\"
    : \"none\";\r\n      document.getElementById(\"register\").style.display =\r\n
    \       document.getElementById(\"register\").style.display === \"none\" ? \"block\"
    : \"none\";\r\n    }\r\n\r\n    async function login() {\r\n      const username
    = document.getElementById(\"username\").value;\r\n      const password = document.getElementById(\"password\").value;\r\n
    \     \r\n      try {\r\n        const res = await fetch(`${API}/login`, {\r\n
    \         method: \"POST\",\r\n          headers: {\"Content-Type\":\"application/json\"},\r\n
    \         body: JSON.stringify({username, password})\r\n        });\r\n        \r\n
    \       const data = await res.json();\r\n        \r\n        if (res.ok && data.accessToken)
    {\r\n          localStorage.setItem(\"accessToken\", data.accessToken);\r\n          localStorage.setItem(\"username\",
    data.user.username);\r\n          localStorage.setItem(\"userId\", data.user.id);\r\n
    \         window.location.href = \"./games.html\";\r\n        } else {\r\n          alert(\"Error:
    \" + (data.error || \"usuario o contraseña incorrectos\"));\r\n        }\r\n      }
    catch (error) {\r\n        console.error(\"Login error:\", error);\r\n        alert(\"Error
    de conexión. Por favor, intenta de nuevo.\");\r\n      }\r\n    }\r\n\r\n    async
    function register() {\r\n      const username = document.getElementById(\"newUsername\").value;\r\n
    \     const password = document.getElementById(\"newPassword\").value;\r\n      \r\n
    \     // Validación en el cliente\r\n      if (!username || username.length <
    3) {\r\n        alert(\"El nombre de usuario debe tener al menos 3 caracteres\");\r\n
    \       return;\r\n      }\r\n      \r\n      if (!password || password.length
    < 6) {\r\n        alert(\"La contraseña debe tener al menos 6 caracteres\");\r\n
    \       return;\r\n      }\r\n      \r\n      try {\r\n        const res = await
    fetch(`${API}/register`, {\r\n          method: \"POST\",\r\n          headers:
    {\"Content-Type\":\"application/json\"},\r\n          body: JSON.stringify({username,
    password})\r\n        });\r\n        \r\n        const data = await res.json();\r\n
    \       \r\n        if (res.ok) {\r\n          alert(\"Cuenta creada correctamente.
    ¡Ahora puedes iniciar sesión!\");\r\n          toggleForm();\r\n        } else
    {\r\n          if (data.error && data.error.includes(\"duplicate key value\"))
    {\r\n            alert(\"Error: El usuario ya existe. Por favor, elige otro nombre
    de usuario.\");\r\n          } else if (data.error && data.details) {\r\n            alert(\"Error:
    \" + data.error + \"\\n\" + data.details.join(\"\\n\"));\r\n          } else {\r\n
    \           alert(\"Error: \" + (data.error || \"No se pudo crear la cuenta\"));\r\n
    \         }\r\n        }\r\n      } catch (error) {\r\n        console.error(\"Register
    error:\", error);\r\n        alert(\"Error de conexión. Por favor, intenta de
    nuevo.\");\r\n      }\r\n    }\r\n  </script>\r\n</body>\r\n</html>\r\n"
