apiVersion: v1
kind: ServiceAccount
metadata:
  name: patch-deployment-sa
  namespace: retrogame
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: patch-deployment-role
  namespace: retrogame
rules:
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "patch"]
- apiGroups: [""]
  resources: ["pods", "pods/exec"]
  verbs: ["get", "list", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: patch-deployment-rolebinding
  namespace: retrogame
subjects:
- kind: ServiceAccount
  name: patch-deployment-sa
  namespace: retrogame
roleRef:
  kind: Role
  name: patch-deployment-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: patch-frontend-env
  namespace: retrogame
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  template:
    spec:
      serviceAccountName: patch-deployment-sa
      containers:
      - name: kubectl
        image: bitnami/kubectl:latest
        command:
        - /bin/bash
        - -c
        - |
          kubectl patch deployment frontend-deployment -n retrogame --type='strategic' --patch '
          spec:
            template:
              spec:
                volumes:
                - name: html-files
                  configMap:
                    name: frontend-html
                containers:
                - name: frontend
                  env:
                  - name: PORT
                    value: "8080"
                  - name: NODE_ENV
                    value: "production"
                  - name: API_URL
                    value: "https://retrogamehub.games/api"
                  - name: CDN_URL
                    value: "https://cdn.retrogamehub.games"
                  volumeMounts:
                  - name: html-files
                    mountPath: /app/index.html
                    subPath: index.html
                  - name: html-files
                    mountPath: /app/games.html
                    subPath: games.html
          '
      restartPolicy: Never
  backoffLimit: 3
