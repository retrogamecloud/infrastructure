# Este archivo debe aplicarse con kubectl patch, NO con kubectl apply
# Usa el script apply-github-oauth.sh o ejecuta manualmente el patch

# GitHub OAuth Configuration para ArgoCD
# IMPORTANTE: Reutiliza el mismo GitHub OAuth App que oauth2-proxy
# Client ID: Ov23lil4DINdiuLj2XnS (mismo que oauth2-proxy en monitoring namespace)
# Client Secret: Compartido desde el secret oauth2-proxy

# Para aplicar esta configuración, ejecuta:
# kubectl patch configmap argocd-cm -n argocd --type merge --patch-file argocd-cm-github.yaml

apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
data:
  # GitHub OAuth Configuration via Dex
  url: https://retrogamehub.games/argocd
  dex.config: |
    connectors:
    - type: github
      id: github
      name: GitHub
      config:
        clientID: Ov23lil4DINdiuLj2XnS
        clientSecret: $dex.github.clientSecret
        orgs:
        - name: retrogamecloud
        loadAllGroups: false
        teamNameField: slug
        useLoginAsID: false

  # Política de RBAC por defecto para usuarios no autenticados
  policy.default: role:readonly
  
  # Políticas de RBAC para la organización
  policy.csv: |
    g, retrogamecloud:*, role:admin
