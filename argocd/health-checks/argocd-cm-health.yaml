apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cm
    app.kubernetes.io/part-of: argocd
data:
  # Health check personalizado para Deployments que exponen /health
  resource.customizations.health.apps_Deployment: |
    hs = {}
    hs.status = "Progressing"
    hs.message = ""
    if obj.status ~= nil then
      if obj.status.conditions ~= nil then
        for i, condition in ipairs(obj.status.conditions) do
          if condition.type == "Progressing" and condition.reason == "ProgressDeadlineExceeded" then
            hs.status = "Degraded"
            hs.message = condition.message
            return hs
          end
          if condition.type == "Progressing" and condition.status == "True" and condition.reason == "NewReplicaSetAvailable" then
            hs.status = "Healthy"
            hs.message = condition.message
            return hs
          end
          if condition.type == "Available" and condition.status == "True" then
            hs.status = "Healthy"
            hs.message = "Deployment is available"
            return hs
          end
        end
      end
      if obj.status.replicas ~= nil and obj.status.updatedReplicas ~= nil and obj.status.replicas == obj.status.updatedReplicas and obj.status.availableReplicas == obj.status.replicas then
        hs.status = "Healthy"
        hs.message = "All replicas are ready"
        return hs
      end
    end
    return hs

  # Timeout para health checks más largo para nuestros servicios
  timeout.reconciliation: 180s
