apiVersion: v1
kind: ServiceAccount
metadata:
  name: patch-ingress-sa
  namespace: retrogame
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: patch-ingress-role
  namespace: retrogame
rules:
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses"]
  verbs: ["get", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: patch-ingress-rolebinding
  namespace: retrogame
subjects:
- kind: ServiceAccount
  name: patch-ingress-sa
  namespace: retrogame
roleRef:
  kind: Role
  name: patch-ingress-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: patch-ingress
  namespace: retrogame
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  template:
    spec:
      serviceAccountName: patch-ingress-sa
      containers:
      - name: kubectl
        image: bitnami/kubectl:latest
        command:
        - /bin/bash
        - -c
        - |
          # Parchear backend-ingress para que apunte a kong-service
          kubectl patch ingress backend-ingress -n retrogame --type='json' -p='[
            {
              "op": "replace",
              "path": "/spec/rules/0/http/paths/0/backend/service/name",
              "value": "kong-service"
            },
            {
              "op": "replace",
              "path": "/spec/rules/0/http/paths/0/backend/service/port/number",
              "value": 80
            }
          ]'
          
          # Parchear frontend-ingress para que apunte a kong-service
          kubectl patch ingress frontend-ingress -n retrogame --type='json' -p='[
            {
              "op": "replace",
              "path": "/spec/rules/0/http/paths/0/backend/service/name",
              "value": "kong-service"
            },
            {
              "op": "replace",
              "path": "/spec/rules/0/http/paths/0/backend/service/port/number",
              "value": 80
            }
          ]'
      restartPolicy: Never
  backoffLimit: 3
