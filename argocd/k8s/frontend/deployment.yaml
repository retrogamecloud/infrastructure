apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: retrogame
  labels:
    app: frontend
    component: gamehub-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        component: gamehub-frontend
    spec:
      # Init container 1: Copiar archivos de la imagen al volumen compartido
      initContainers:
      - name: copy-files
        image: retrogamehub/frontend:sha-2f9f13a
        command: ["sh", "-c", "cp -r /app/* /shared/ && cp -r /app/.[^.]* /shared/ 2>/dev/null || true && ls -la /shared"]
        volumeMounts:
        - name: app-files
          mountPath: /shared
      
      # Init container 2: Reemplazar URLs en los archivos copiados
      - name: url-replacer
        image: busybox:1.35
        command: ["sh", "/scripts/replace-urls.sh"]
        volumeMounts:
        - name: app-files
          mountPath: /app
        - name: replacer-script
          mountPath: /scripts
      
      containers:
      - name: frontend
        image: retrogamehub/frontend:sha-2f9f13a
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "8080"
        volumeMounts:
        - name: app-files
          mountPath: /app
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      
      volumes:
      - name: app-files
        emptyDir: {}
      - name: replacer-script
        configMap:
          name: frontend-replacer
          defaultMode: 0755
