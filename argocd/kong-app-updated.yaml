apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kong
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: retrogame
    server: https://kubernetes.default.svc
  project: default
  revisionHistoryLimit: 10
  sources:
    # Source 1: Base resources from kubernetes repo
    - repoURL: https://github.com/retrogamecloud/kubernetes.git
      targetRevision: main
      path: .
      directory:
        recurse: false
        include: "05-kong.yaml"
        exclude: "{00-*,01-*,02-*,03-*,04-*,06-*,package*,README*,*.md}"
    
    # Source 2: Production overlays from infrastructure repo
    - repoURL: https://github.com/retrogamecloud/infrastructure.git
      targetRevision: main
      path: argocd/kong-overlays
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
      limit: 5
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
