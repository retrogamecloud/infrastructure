apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: retrogameargo
  labels:
    app: frontend
    component: gamehub-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        component: gamehub-frontend
    spec:
      containers:
      - name: frontend
        image: retrogamehub/frontend:latest  # Will be updated by CI/CD
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "8080"
        - name: API_URL
          value: "https://retrogamehub.games/api"
        - name: CDN_URL
          value: "https://cdn.retrogamehub.games"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
