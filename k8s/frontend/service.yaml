apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: retrogame
  labels:
    app: frontend
  annotations:
    argocd.argoproj.io/tracking-id: 'frontend:/Service:retrogame/frontend-service'
spec:
  type: ClusterIP
  ports:
  - port: 8081
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: frontend
