# SonarCloud configuration for infrastructure repository
sonar.projectKey=retrogamecloud_infrastructure
sonar.organization=retrogamecloud

# Project information
sonar.projectName=RetroGameCloud Infrastructure
sonar.projectVersion=1.0

# Source directories (IaC files)
sonar.sources=terraform,infrastructure/argocd

# Exclusions
sonar.exclusions=\
  **/*.tfstate,\
  **/*.tfstate.backup,\
  **/node_modules/**,\
  **/.terraform/**,\
  **/vendor/**,\
  **/*.md,\
  **/tests/**

# Language-specific settings
sonar.sourceEncoding=UTF-8

# Coverage (not applicable for IaC, but keeping for consistency)
sonar.coverage.exclusions=**/*

# Code smells and bugs detection for IaC
sonar.issue.ignore.multicriteria=e1

# Ignore specific rules if needed
# Example: sonar.issue.ignore.multicriteria.e1.ruleKey=terraform:S1234
# Example: sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.tf
