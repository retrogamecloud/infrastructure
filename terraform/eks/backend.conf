# Configuración del backend S3 desde bootstrap
# Usar con: terraform init -backend-config=backend.conf

# NOTA: Actualizar estos valores después de ejecutar bootstrap:
# cd ../bootstrap && terraform output terraform_state_bucket

bucket         = "retrogamecloud-terraform-state-450545962171"
