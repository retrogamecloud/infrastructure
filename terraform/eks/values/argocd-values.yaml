server:
  replicas: 1
  
  extraArgs:
    - --insecure
    - --basehref=/argocd
    - --rootpath=/argocd
  
  ingress:
    enabled: false  # We manage ingress via Terraform
  
  service:
    type: ClusterIP

controller:
  replicas: 1

repoServer:
  replicas: 1

applicationSet:
  replicas: 1

configs:
  params:
    server.insecure: true
  
  cm:
    # ArgoCD URL
    url: https://retrogamehub.games/argocd
    
    # Enable anonymous access to metrics
    metrics.enabled: true
    
    # Timeout for repository operations
    timeout.reconciliation: 180s
    
    # Resource tracking method
    application.resourceTrackingMethod: annotation
    
    # GitHub OAuth via Dex
    # IMPORTANT: clientID and clientSecret are injected from argocd-secret Kubernetes Secret
    # Created by Terraform in argocd-secrets.tf, values from AWS Secrets Manager
    dex.config: |
      connectors:
      - type: github
        id: github
        name: GitHub
        config:
          clientID: $dex.github.clientID
          clientSecret: $dex.github.clientSecret
          orgs:
          - name: retrogamecloud
  
  # RBAC Configuration
  rbac:
    policy.default: role:readonly
    policy.csv: |
      g, jpalenz77, role:admin
      g, naesman1, role:admin
      g, evaristogz, role:admin
      g, retrogamecloud:*, role:admin
    scopes: '[groups]'

  repositories:
    # These will be configured via ArgoCD UI or kubectl after installation
    # Example for reference:
    # - url: https://github.com/retrogamecloud/infrastructure.git
    #   type: git
    # - url: https://github.com/retrogamecloud/backend.git
    #   type: git
    # - url: https://github.com/retrogamecloud/frontend.git
    #   type: git
    # - url: https://github.com/retrogamecloud/kong.git
    #   type: git

# Redis for caching
redis:
  enabled: true
  replicas: 1

# Notifications controller
notifications:
  enabled: true
  
  # ArgoCD Notifications Controller configuration
  argocdUrl: https://retrogamehub.games/argocd
  
  # Notification services (Slack)
  notifiers:
    service.slack: |
      token: $slack-token
  
  # Notification templates
  templates:
    template.app-deployed: |
      message: |
        :rocket: La aplicación {{.app.metadata.name}} está ejecutando una nueva versión.
      slack:
        attachments: |
          [{
            "title": "{{.app.metadata.name}}",
            "title_link":"{{.context.argocdUrl}}/applications/{{.app.metadata.name}}",
            "color": "good",
            "fields": [
            {
              "title": "Estado de Sincronización",
              "value": "{{.app.status.sync.status}}",
              "short": true
            },
            {
              "title": "Repositorio",
              "value": "{{.app.spec.source.repoURL}}",
              "short": true
            }
            ]
          }]
    
    template.app-health-degraded: |
      message: |
        :warning: La aplicación {{.app.metadata.name}} se ha degradado.
      slack:
        attachments: |
          [{
            "title": "{{.app.metadata.name}}",
            "title_link": "{{.context.argocdUrl}}/applications/{{.app.metadata.name}}",
            "color": "warning",
            "fields": [
            {
              "title": "Estado de Salud",
              "value": "{{.app.status.health.status}}",
              "short": true
            },
            {
              "title": "Repositorio",
              "value": "{{.app.spec.source.repoURL}}",
              "short": true
            }
            ]
          }]
    
    template.app-sync-failed: |
      message: |
        :x: La sincronización de {{.app.metadata.name}} ha fallado.
      slack:
        attachments: |
          [{
            "title": "{{.app.metadata.name}}",
            "title_link":"{{.context.argocdUrl}}/applications/{{.app.metadata.name}}",
            "color": "danger",
            "fields": [
            {
              "title": "Estado de Sincronización",
              "value": "{{.app.status.sync.status}}",
              "short": true
            },
            {
              "title": "Repositorio",
              "value": "{{.app.spec.source.repoURL}}",
              "short": true
            }
            ]
          }]
  
  # Notification triggers
  triggers:
    trigger.on-deployed: |
      - when: app.status.operationState.phase in ['Succeeded']
        send: [app-deployed]
    trigger.on-health-degraded: |
      - when: app.status.health.status == 'Degraded'
        send: [app-health-degraded]
    trigger.on-sync-failed: |
      - when: app.status.operationState.phase in ['Error', 'Failed']
        send: [app-sync-failed]

# Resource limits
global:
  image:
    tag: v3.2.0
